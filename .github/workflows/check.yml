name: check-content

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 校验页面登记、H1 与导航一致、SVG 规范、站内链接、孤儿页面，以及搜索索引是否最新
      - name: Check content
        run: python tools/check.py
